<!DOCTYPE html>
<html lang="en">


<head>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header></header>
    <main>
        <form>
            <div class="form-item column2"><label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="text" id="useremail" name="useremail" required></divclass>
            </div>

            <div class="form-item column1"><label for="user's favorite browser">What is your
                    favorite
                    browser?</label>
                <select name="user's favorite browser" id="user's favorite browser">
                    <option value="chrome">Chrome</option>
                    <option value="mozilla">Mozilla</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-item column1"><label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item"><label for="feedback">List the places you had lived: </label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Bogota Colombia, Mexico DF Mexico, London England"></textarea>
            </div>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
